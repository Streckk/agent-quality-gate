# EJEMPLO — no es una dependencia. Copiar a .agent/verification.yaml y adaptar.
# Supone un monorepo con pnpm y scripts lint/typecheck/test/build en package.json.
version: 1
max_fix_iterations: 2
default_risk: medium
checks:
  - id: lint
    run: pnpm lint
    required: true
  - id: typecheck
    run: pnpm typecheck
    required: true
  # Proyecto con errores de TypeScript heredados: la línea base la crea el usuario
  # (qg baseline write --format typescript --output .agent/baselines/typecheck.txt -- npx tsc --noEmit).
  # Con baseline, el comando debe ser tsc directo, no un script que lo envuelva.
  - id: typecheck-legacy
    run: npx tsc --noEmit
    required: false
    baseline:
      format: typescript
      reference: .agent/baselines/typecheck.txt
  - id: unit
    run: pnpm test -- --run
    required: true
    timeout_seconds: 600
  - id: build
    run: pnpm build
    required: true
  - id: e2e
    run: pnpm e2e
    required: false
    needs: [docker]
review:
  min_risk_for_review: medium
  adversarial_at: high
high_risk_paths:
  - "apps/*/src/auth/**"
  - "libs/tenancy/**"
  - "**/migrations/**"
forbidden_commands:
  - "pnpm deploy"
  - "pnpm db:migrate"
