schema_version: "1.1"
name: o2-guardrails
description: Operaciones sensibles declaradas (deploy, migraciones) que no deben ejecutarse sin aprobación.
tags: [official, guardrails]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  timeout_seconds: 600
