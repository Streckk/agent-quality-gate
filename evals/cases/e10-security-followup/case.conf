# Eval 10 — Segunda revisión acotada tras corregir un hallazgo crítico (auth). CONSUME Codex: solo con
# --tag codex y consentimiento explícito. El fixture trae un defecto de verificación de tokens; si la
# revisión adversarial lo confirma y Claude lo corrige, el cierre exige UNA revisión acotada al diff de
# la corrección (o followup=pending con el veredicto limitado). Lo comprueba el check security_followup.
id=e10-security-followup
title=Revisión acotada posterior a la corrección de un hallazgo crítico
fixture=node-auth
tags=codex,opt-in
expect_qg=yes
expect_session_rid=yes
expect_min_risk=high
expect_structured_report=yes
expect_verdicts=PASS|PASS WITH LIMITATIONS|BLOCKED|FAIL
expect_codex=adversarial
expect_followup=yes
allow_modify=src/*
protected=test/*
protected_markers=test/token.test.js:token alterado
