name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validar estructura, frontmatter y enlaces
        run: bash tests/validate.sh
      - name: Probar que el validador detecta errores
        run: bash tests/validate_selftest.sh
      - name: ShellCheck (preinstalado en el runner)
        run: |
          shellcheck --version
          shellcheck -s bash -S warning bin/qg bin/qg-run hooks/*.sh hooks/lib/common.sh evals/*.sh evals/lib/fixtures.sh evals/official/*/scaffold.sh tests/*.sh tests/core/*.sh tests/hooks/*.sh tests/evals/*.sh tests/scenarios/*.sh

  evidencia:
    name: qg (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Pruebas de bin/qg
        run: bash tests/run_core_tests.sh
      - name: Pruebas de los hooks
        run: bash tests/run_hook_tests.sh
      - name: Agent Evals nivel A (evaluador determinista, sin modelos)
        run: bash tests/run_eval_tests.sh
      - name: Pruebas de bin/qg y hooks con /bin/bash del sistema (3.2 en macOS)
        if: runner.os == 'macOS'
        env:
          QG_BASH: /bin/bash
        run: |
          /bin/bash tests/run_core_tests.sh
          /bin/bash tests/run_hook_tests.sh
          /bin/bash tests/run_eval_tests.sh
